name: CP139 public validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cp139-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cp139-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate public CP139 closure
        shell: bash
        run: bash .github/scripts/validate-cp139-public.sh
